name: deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    name: Pulumi preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@<FULL-COMMIT-SHA>
        with:
          fetch-depth: 0
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@<FULL-COMMIT-SHA>
        with:
          role-to-assume: <ARN-ROLE-PREVIEW-CAN-DOI-CHIEU>
          aws-region: <REGION-CAN-DOI-CHIEU>
      - name: Install Pulumi
        uses: pulumi/actions@<FULL-COMMIT-SHA>
        with:
          command: preview
          stack: dev
          work-dir: infra/pulumi
      - name: Post preview diff to PR
        uses: actions/github-script@<FULL-COMMIT-SHA>
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('preview.txt', 'utf8').slice(0, 60000);
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## Pulumi preview diff\n\n```\n' + diff + '\n```\n\nReviewer phai doc diff nay truoc khi Approve.'
            });

  policy:
    name: Policy as code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@<FULL-COMMIT-SHA>
      - name: Conftest policy check
        uses: open-policy-agent/setup-opa@<FULL-COMMIT-SHA>
        with:
          version: latest
      - name: Run conftest
        run: |
          conftest test --policy policy/ pulumi-plan.json

  apply-staging:
    name: Apply staging
    runs-on: ubuntu-latest
    needs: [preview, policy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@<FULL-COMMIT-SHA>
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@<FULL-COMMIT-SHA>
        with:
          role-to-assume: <ARN-ROLE-STAGING-CAN-DOI-CHIEU>
          aws-region: <REGION-CAN-DOI-CHIEU>
      - name: Pulumi up staging
        run: pulumi up --yes --stack staging --work-dir infra/pulumi

  apply-prod:
    name: Apply prod
    runs-on: ubuntu-latest
    needs: [apply-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@<FULL-COMMIT-SHA>
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@<FULL-COMMIT-SHA>
        with:
          role-to-assume: <ARN-ROLE-PROD-CAN-DOI-CHIEU>
          aws-region: <REGION-CAN-DOI-CHIEU>
      - name: Pulumi up prod
        run: pulumi up --yes --stack prod --work-dir infra/pulumi
