name: ci
on:
  pull_request:
    branches: [main]
permissions: {}
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Lint workflows
        run: python3 -I scripts/lint-workflows.py .github
      - name: Policy pack unit tests
        run: npm ci --ignore-scripts && npm test
        working-directory: policy
      - name: Gate script tests
        run: node --test scripts/gates.test.mjs
  preview:
    name: pulumi preview (staging, read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL_STAGING }}
      PULUMI_SKIP_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: ./trusted/.github/actions/pulumi-env
        with:
          role-arn: ${{ vars.AWS_PLAN_ROLE_ARN_STAGING }}
          region: ${{ vars.AWS_REGION_STAGING }}
          pulumi-version: ${{ vars.PULUMI_VERSION }}
      - name: Build trusted policy pack
        run: npm ci --ignore-scripts && npm run build
        working-directory: trusted/policy
      - name: Install infra deps
        run: npm ci --ignore-scripts
        working-directory: pr/infra
      - name: Preview with policy pack
        id: preview
        working-directory: pr/infra
        run: |
          set +e
          pulumi preview --stack staging --non-interactive --json --policy-pack "$GITHUB_WORKSPACE/trusted/policy" --policy-pack-config "$GITHUB_WORKSPACE/trusted/policy/config.staging.json" > "$RUNNER_TEMP/preview.json" 2> "$RUNNER_TEMP/preview.err"
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Gate and sanitized summary
        id: gate
        run: |
          set +e
          node trusted/scripts/preview-gate.mjs gate --preview "$RUNNER_TEMP/preview.json" --stack staging --out "$RUNNER_TEMP/summary.md" --steps-out "$RUNNER_TEMP/steps.json" --allow trusted/.github/preview-allow.json
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-summary
          path: |
            ${{ runner.temp }}/summary.md
            ${{ runner.temp }}/steps.json
          if-no-files-found: error
          retention-days: 7
      - name: Fail if preview or gate failed
        env:
          PREVIEW_STATUS: ${{ steps.preview.outputs.status }}
          GATE_STATUS: ${{ steps.gate.outputs.status }}
        run: |
          [ "$PREVIEW_STATUS" = "0" ] && [ "$GATE_STATUS" = "0" ] || { echo "preview=$PREVIEW_STATUS gate=$GATE_STATUS"; exit 1; }
  comment:
    name: post preview to PR
    needs: preview
    if: ${{ always() && needs.preview.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-summary
          path: ${{ runner.temp }}/in
      - name: Upsert PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash scripts/post-comment.sh "$REPO" "$PR" "$RUNNER_TEMP/in/summary.md" staging
