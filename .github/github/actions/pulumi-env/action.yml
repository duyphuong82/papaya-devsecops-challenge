name: pulumi-env
description: Cài Pulumi CLI và assume role AWS qua OIDC. Không dùng access key.
inputs:
  role-arn:
    required: true
  region:
    required: true
  pulumi-version:
    required: true
runs:
  using: composite
  steps:
    - uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
      with:
        pulumi-version: ${{ inputs.pulumi-version }}
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.region }}
        role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
